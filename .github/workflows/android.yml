name: Android APK

on:
  push:
    paths: ['mobile/android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3

      # Optional release signing: set ANDROID_KEYSTORE_BASE64 + ANDROID_KEYSTORE_PASSWORD secrets.
      # Without them the APK is signed with a throwaway debug key.
      - name: Configure signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        if: env.KEYSTORE != ''
        run: |
          echo "$KEYSTORE" | base64 -d > pear-release.jks
          printf "storeFile=pear-release.jks\nstorePassword=%s\nkeyAlias=pear\nkeyPassword=%s\n" "$PASSWORD" "$PASSWORD" > keystore.properties

      - run: ./gradlew assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: pear-mobile-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
