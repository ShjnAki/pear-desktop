# /etc/nginx/sites-available/pear  —  then: ln -s ../sites-available/pear /etc/nginx/sites-enabled/
# HTTPS: sudo certbot --nginx -d pear.shinaki.cc
#
# PEAR_PC = address of the PC running Pear Desktop, reachable from the VPS
# (Tailscale IP like 100.x.y.z recommended; see mobile/README.md).

upstream pear_desktop {
  server 100.64.0.2:26538;   # <-- PEAR_PC:port of the API Server plugin
}

server {
  listen 80;
  server_name pear.shinaki.cc;

  root /var/www/pear;        # contents of mobile/remote/ (+ pear-mobile.apk)
  index index.html;

  # PWA shell
  location / {
    try_files $uri $uri/ /index.html;
  }
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }
  location = /pear-mobile.apk {
    types { application/vnd.android.package-archive apk; }
    add_header Content-Disposition 'attachment; filename="pear-mobile.apk"';
  }

  # Pear Desktop API Server (REST + WebSocket), same origin as the PWA:
  # avoids mixed-content blocking (https page -> http LAN API).
  location /auth/ {
    proxy_pass http://pear_desktop;
    proxy_set_header Host $host;
    # The first connection waits for you to click "Allow" on the PC.
    proxy_read_timeout 120s;
  }
  location /api/ {
    proxy_pass http://pear_desktop;
    proxy_set_header Host $host;
  }
  location = /api/v1/ws {
    proxy_pass http://pear_desktop;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1d;
  }
}
